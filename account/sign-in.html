<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f1e7"><title>Sign in | JuteOrb</title><link rel="stylesheet" href="styles/account.css"><script src="scripts/account.js" defer></script></head><body><main class="auth-shell"><a class="auth-brand" href="../index.html">JuteOrb<small>ACCOUNT ACCESS</small></a><section class="auth-card"><div class="auth-tabs"><button class="auth-tab active" data-mode="signin">Sign in</button><button class="auth-tab" data-mode="create">Create account</button></div><div id="signinPanel"><p class="auth-kicker">Customer or administrator</p><h1>Sign in</h1><form id="signinForm"><label for="loginName">Username</label><input id="loginName" autocomplete="username" required><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required><button class="auth-submit">Continue <span>→</span></button></form><p id="signinMessage" class="message" aria-live="polite"></p></div><div id="createPanel" hidden><p class="auth-kicker">Customer account</p><h1>Create account</h1><form id="createForm"><label for="customerName">Name</label><input id="customerName" required autocomplete="name"><label for="newUsername">Choose a username</label><input id="newUsername" required autocomplete="username"><label for="newPassword">Choose a password</label><input id="newPassword" type="password" minlength="4" required autocomplete="new-password"><button class="auth-submit">Create account <span>→</span></button></form><p id="createMessage" class="message" aria-live="polite"></p></div><aside class="auth-notice"><strong>Prototype account access</strong><br>Accounts are saved only in this browser. Do not use real or reused passwords. This static site is not connected to live orders or a secure account server.</aside></section><a class="return-link" href="../index.html">← Return to JuteOrb</a></main></body></html>
